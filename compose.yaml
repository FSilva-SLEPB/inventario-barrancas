# Entorno de desarrollo
services:
  web:
    image: node:24-bookworm-slim
    user: "${LOCAL_UID:?Falta LOCAL_UID}:${LOCAL_GID:?Falta LOCAL_GID}"
    working_dir: /app
    init: true
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      npm_config_cache: /tmp/npm-cache
    volumes:
      - ./web:/app:Z
    ports:
      - "127.0.0.1:3000:3000"
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]

  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: inventario
      POSTGRES_USER: inventario_admin
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:?Falta APP_DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrar:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.migraciones
    init: true
    environment:
      DATABASE_URL: "postgresql://inventario_admin:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}@db:5432/inventario"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
