name: Verificaciones web

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: ESLint y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web
        shell: bash

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    # Credenciales exclusivas de la base temporal de CI.
    services:
      db:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: inventario
          POSTGRES_USER: inventario_admin
          POSTGRES_PASSWORD: ci_admin_inventario
          APP_DB_PASSWORD: ci_app_inventario
        ports:
          - "5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U inventario_admin -d inventario"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      - name: Obtener código
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Preparar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar vulnerabilidades conocidas
        run: npm audit --audit-level=moderate

      - name: Revisar dependencias de migraciones
        working-directory: migraciones
        run: npm audit --audit-level=moderate

      - name: Probar validación de sedes
        run: node --test tests/validacion-sedes.test.mjs

      - name: Probar validación de dependencias
        run: node --test tests/validacion-dependencias.test.mjs

      - name: Probar las tres reglas de estados del activo
        run: node --test tests/estados-activo.test.mjs tests/imagenes-insumos.test.mjs tests/navegacion-insumos.test.mjs

      - name: Probar identidad, permisos y vistas de inventario
        run: node --experimental-vm-modules --test tests/acceso.test.mjs tests/inventario-vistas.test.mjs tests/entregas.test.mjs tests/directorio.test.mjs tests/robos.test.mjs tests/funcionarios.test.mjs tests/guardado-y-nombres.test.mjs tests/ficha-inventario.test.mjs tests/celulares.test.mjs tests/movimientos-inventario.test.mjs tests/actas.test.mjs tests/prestamos.test.mjs tests/operaciones-inventario.test.mjs

      - name: Probar preparación privada del acceso
        run: python3 ../tests/acceso/probar-preparacion.py

      - name: Comprobar sintaxis de scripts de respaldo
        run: |
          for archivo in \
            ../scripts/autorizar-drive-inventario.sh \
            ../scripts/preparar-cifrado-drive.sh \
            ../scripts/respaldar-postgresql-drive.sh \
            ../scripts/verificar-cifrado-postgresql.sh; do
            bash -n "$archivo"
          done

      - name: Probar control del envío a Drive sin credenciales reales
        run: python3 ../tests/respaldos/probar-envio-drive.py

      - name: Probar medición, retención y avisos sin servicios reales
        run: python3 ../tests/respaldos/probar-control-respaldos.py

      - name: Probar configuración de producción sin secretos reales
        run: python3 ../tests/produccion/probar-configuracion.py

      - name: Probar revisión de instalación sin servicios ni secretos reales
        run: python3 ../tests/produccion/probar-instalacion.py

      - name: Revisar código
        run: npm run lint

      - name: Preparar usuario de la aplicación
        env:
          DB_CONTAINER: ${{ job.services.db.id }}
        run: |
          docker exec -i "$DB_CONTAINER" psql -X \
            -U inventario_admin -d inventario \
            -v ON_ERROR_STOP=1 --single-transaction -f - \
            < ../database/preparar-usuario.sql

      - name: Probar ampliación del gestor sin reasignar cuentas y comprobar migraciones
        env:
          DATABASE_URL: "postgresql://inventario_admin:ci_admin_inventario@127.0.0.1:${{ job.services.db.ports[5432] }}/inventario"
        run: |
          npx node-pg-migrate up 38 --migrations-schema public --no-verbose
          TEST_ADMIN_DATABASE_URL="$DATABASE_URL" node tests/gestor-migracion.mjs
          npx node-pg-migrate up 1 --migrations-schema public --no-verbose
          TEST_ADMIN_DATABASE_URL="$DATABASE_URL" node tests/descargas-migracion.mjs
          npm run db:migrate
          npm run db:migrate

      - name: Verificar conexión, permisos y catálogos
        env:
          DATABASE_URL: "postgresql://inventario_app:ci_app_inventario@127.0.0.1:${{ job.services.db.ports[5432] }}/inventario"
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import pg from "pg";

          const cliente = new pg.Client({
            connectionString: process.env.DATABASE_URL,
            connectionTimeoutMillis: 5000,
          });

          await cliente.connect();
          try {
            const contar = async () => {
              const { rows } = await cliente.query(`
                SELECT
                  (SELECT count(*) FROM public.sedes) AS sedes,
                  (SELECT count(*) FROM public.dependencias) AS dependencias,
                  (SELECT count(*) FROM public.categorias_bienes) AS categorias
              `);
              return JSON.stringify(rows[0]);
            };
            const antes = await contar();
            await cliente.query(
              await readFile("../database/verificar-catalogos.sql", "utf8")
            );
            const verificarAcceso = await readFile("../database/verificar-acceso.sql", "utf8");
            await cliente.query(verificarAcceso.replace(/^\\set.*$/gm, ""));
            const verificarUsuarios = await readFile("../database/verificar-usuarios.sql", "utf8");
            await cliente.query(verificarUsuarios.replace(/^\\set.*$/gm, ""));
            if (await contar() !== antes) {
              throw new Error("Las pruebas alteraron la cantidad de registros.");
            }
            console.log("Conexión, permisos y catálogos verificados.");
          } finally {
            await cliente.end();
          }
          NODE

      - name: Probar respaldo, cifrado y restauración sin acceso a Drive
        env:
          RESPALDO_DB_CONTAINER: ${{ job.services.db.id }}
        run: |
          docker exec -i "$RESPALDO_DB_CONTAINER" psql -X \
            -U inventario_admin -d inventario -v ON_ERROR_STOP=1 -f - \
            < ../database/datos-prueba-respaldo.sql
          directorio_ci="$(mktemp -d "$RUNNER_TEMP/respaldos-postgresql.XXXXXXXX")"
          trap 'rm -rf -- "$directorio_ci"' EXIT
          respaldo_ci="$(bash ../scripts/respaldar-postgresql.sh "$directorio_ci")"
          bash ../scripts/verificar-cifrado-postgresql.sh "$respaldo_ci" --datos-ci

      - name: Compilar aplicación
        run: npm run build

      - name: Probar acceso HTTP con sesiones ficticias y base temporal
        env:
          DATABASE_URL: "postgresql://inventario_app:ci_app_inventario@127.0.0.1:${{ job.services.db.ports[5432] }}/inventario"
          TEST_ADMIN_DATABASE_URL: "postgresql://inventario_admin:ci_admin_inventario@127.0.0.1:${{ job.services.db.ports[5432] }}/inventario"
        run: node tests/ejecutar-acceso-http.mjs

      - name: Construir imagen compilada de producción
        working-directory: .
        run: docker build --build-arg APP_REVISION="$GITHUB_SHA" -f Dockerfile.web -t inventario-ci-web:prueba .

      - name: Probar la imagen de producción con sesiones y base temporales
        working-directory: .
        env:
          PRUEBA_IMAGEN: inventario-ci-web:prueba
          PRUEBA_DB_CONTAINER: ${{ job.services.db.id }}
          DATABASE_URL: "postgresql://inventario_app:ci_app_inventario@127.0.0.1:${{ job.services.db.ports[5432] }}/inventario"
          TEST_ADMIN_DATABASE_URL: "postgresql://inventario_admin:ci_admin_inventario@127.0.0.1:${{ job.services.db.ports[5432] }}/inventario"
        run: node scripts/probar-imagen-produccion.mjs
